<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly | Smart Daily Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col justify-between min-h-screen">

  <!-- Navigation -->
  <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto w-full">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-wallet text-indigo-500 text-2xl"></i>
      <span class="text-xl font-bold tracking-wide text-white" data-i18n="brandName">Spendly</span>
    </div>
    <div class="flex items-center gap-4">
      <button id="lang-toggle-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-indigo-400 hover:bg-slate-700 transition">🇧🇩 বাংলা</button>
      <a href="login.html" class="px-5 py-2 rounded-lg border border-slate-700 hover:border-slate-500 transition text-sm font-medium" data-i18n="signIn">Sign In</a>
      <a href="register.html" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition text-sm font-medium" data-i18n="signUp">Sign Up</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="max-w-4xl mx-auto text-center px-6 py-16">
    <span class="px-4 py-1.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-sm font-medium" data-i18n="tagline">Smart Daily Expense Tracker</span>
    <h1 class="text-4xl md:text-6xl font-extrabold mt-6 leading-tight" data-i18n="heroTitle">Master Your Daily Spending Effortlessly</h1>
    <p class="text-slate-400 text-lg mt-6 max-w-2xl mx-auto" data-i18n="heroDesc">Track income & expenses, monitor real-time balance with multi-currency support.</p>
    
    <div class="mt-10 flex flex-wrap justify-center gap-4">
      <a href="register.html" class="px-8 py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-lg shadow-lg shadow-indigo-600/30 transition" data-i18n="getStarted">Get Started</a>
      <a href="login.html" class="px-8 py-4 rounded-xl glass-card font-semibold text-lg hover:bg-slate-800 transition" data-i18n="signIn">Sign In</a>
    </div>
  </main>

  <footer class="text-center py-6 border-t border-slate-800 text-slate-500 text-sm">
    &copy; 2026 Spendly. All rights reserved.
  </footer>

  <script src="js/lang.js"></script>
</body>
</html>
