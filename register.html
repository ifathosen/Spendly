<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Spendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="absolute top-6 right-6">
    <button id="lang-toggle-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-indigo-400">🇧🇩 বাংলা</button>
  </div>

  <div class="glass-card p-8 rounded-2xl max-w-md w-full">
    
    <!-- Step 1: Form -->
    <div id="signup-step">
      <h2 class="text-2xl font-bold mb-2 text-center" data-i18n="signUp">Sign Up</h2>

      <form id="signup-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="fullName">Full Name</label>
          <input type="text" id="fullname" required class="w-full px-4 py-2.5 rounded-lg auth-input" placeholder="John Doe">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="email">Email Address</label>
          <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-lg auth-input" placeholder="john@example.com">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="currencyLabel">Select Currency</label>
          <select id="currency" class="w-full px-4 py-2.5 rounded-lg auth-input bg-slate-900">
            <option value="SAR ﷼">SAR ﷼ (Saudi Riyal)</option>
            <option value="৳ BDT">৳ BDT (Bangladeshi Taka)</option>
            <option value="$ USD">$ USD (US Dollar)</option>
            <option value="€ EUR">€ EUR (Euro)</option>
            <option value="₹ INR">₹ INR (Indian Rupee)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="password">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg auth-input" placeholder="••••••••" minlength="6">
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition mt-4" data-i18n="signUp">Sign Up</button>
      </form>
    </div>

    <!-- Step 2: OTP Verification -->
    <div id="otp-step" class="hidden text-center">
      <i class="fa-solid fa-envelope-circle-check text-5xl text-indigo-400 mb-4"></i>
      <h2 class="text-2xl font-bold mb-2" data-i18n="verifyOtp">Verify OTP</h2>
      <p class="text-slate-400 text-sm mb-6">Enter the code sent to your email</p>
      
      <form id="otp-form" class="space-y-4">
        <input type="text" id="otp-code" maxlength="6" class="w-full text-center text-2xl tracking-widest px-4 py-3 rounded-lg auth-input font-mono" placeholder="000000" required>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition" data-i18n="verifyOtp">Verify OTP</button>
      </form>
    </div>

    <p class="text-center text-sm text-slate-400 mt-6">Already have an account? <a href="login.html" class="text-indigo-400 font-medium hover:underline" data-i18n="signIn">Sign In</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
