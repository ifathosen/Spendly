<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Spendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="absolute top-6 right-6">
    <button id="lang-toggle-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-indigo-400">🇧🇩 বাংলা</button>
  </div>

  <div class="glass-card p-8 rounded-2xl max-w-md w-full">
    
    <!-- Login View -->
    <div id="login-view">
      <h2 class="text-2xl font-bold text-center mb-6" data-i18n="signIn">Sign In</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="email">Email Address</label>
          <input type="email" id="login-email" class="w-full px-4 py-2.5 rounded-lg auth-input" required placeholder="john@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="password">Password</label>
          <input type="password" id="login-password" class="w-full px-4 py-2.5 rounded-lg auth-input" required placeholder="••••••••">
        </div>
        <div class="text-right">
          <a href="forgot-password.html" class="text-xs text-indigo-400 hover:underline" data-i18n="forgotPass">Forgot Password?</a>
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition" data-i18n="signIn">Sign In</button>
      </form>
    </div>

    <p class="text-center text-sm text-slate-400 mt-6">Don't have an account? <a href="register.html" class="text-indigo-400 font-medium hover:underline" data-i18n="signUp">Sign Up</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
