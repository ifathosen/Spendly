<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly - App Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans min-h-screen pb-24 relative">

  <!-- Page Transition Loader -->
  <div id="page-loader" class="fixed inset-0 z-[100] bg-[#070a12] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
    <span class="text-sm font-semibold tracking-wider text-slate-400">Loading Dashboard...</span>
  </div>

  <!-- Top App Header -->
  <header class="sticky top-0 z-40 bg-[#070a12]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-wallet text-white text-xs"></i>
      </div>
      <span class="text-lg font-bold text-white tracking-tight" data-i18n="brandName">Spendly</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Language Switcher -->
      <button onclick="toggleLanguage()" class="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-[11px] font-semibold text-slate-300">
        <span id="lang-toggle-text">বাংলা</span>
      </button>

      <!-- Logout -->
      <button id="logout-btn" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Content Workspace Pages -->
  <main class="max-w-md mx-auto px-4 pt-6">

    <!-- 1. Dashboard View (Default Active) -->
    <section id="tab-dashboard" class="tab-page space-y-6">
      <div class="bg-gradient-to-br from-indigo-900/40 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-xl">
        <span class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider" data-i18n="totalBalance">Total Balance</span>
        <div class="text-3xl font-extrabold text-white mt-1" id="total-balance">SAR 0.00</div>
        <p class="text-xs text-slate-400 mt-1" data-i18n="netFunds">Net available funds</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
          <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider" data-i18n="totalIncome">Total Income</span>
          <div class="text-xl font-bold text-emerald-400 mt-1" id="total-income">+SAR 0.00</div>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
          <span class="text-[10px] font-bold text-rose-400 uppercase tracking-wider" data-i18n="totalExpense">Total Expense</span>
          <div class="text-xl font-bold text-rose-400 mt-1" id="total-expense">-SAR 0.00</div>
        </div>
      </div>

      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
        <h3 class="text-sm font-bold text-white mb-3" data-i18n="recentTransactions">Recent Transactions</h3>
        <div id="dashboard-recent-list" class="space-y-2.5">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- 2. Transactions View -->
    <section id="tab-transactions" class="tab-page hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-white" data-i18n="menuTransactions">Transactions</h2>
      </div>
      <input type="text" id="search-input" placeholder="Search transactions..." data-i18n="searchPlaceholder" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
      
      <div id="all-transactions-list" class="space-y-2.5">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- 3. Analytics View -->
    <section id="tab-analytics" class="tab-page hidden space-y-4">
      <h2 class="text-lg font-bold text-white" data-i18n="menuAnalytics">Analytics</h2>
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 text-center text-slate-400 text-xs">
        <i class="fa-solid fa-chart-pie text-3xl text-indigo-400 mb-2"></i>
        <p>Category breakdown active and syncing with database.</p>
      </div>
    </section>

    <!-- 4. Profile View -->
    <section id="tab-profile" class="tab-page hidden space-y-4">
      <h2 class="text-lg font-bold text-white" data-i18n="menuProfile">Profile</h2>
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-3">
        <div class="flex items-center gap-3 pb-3 border-b border-slate-800">
          <div id="user-avatar" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white">U</div>
          <div>
            <h4 id="profile-name-val" class="text-sm font-bold text-white">Loading...</h4>
            <span id="profile-email-val" class="text-xs text-slate-400">Loading...</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Phone Screen Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#090e1a]/95 backdrop-blur-xl border-t border-slate-800/80 px-2 py-2 flex items-center justify-around">
    
    <!-- 1. Dashboard -->
    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center gap-1 text-indigo-400 font-semibold text-[10px]">
      <i class="fa-solid fa-house text-lg"></i>
      <span data-i18n="menuDashboard">Dashboard</span>
    </button>

    <!-- 2. Transactions -->
    <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white font-semibold text-[10px]">
      <i class="fa-solid fa-list-check text-lg"></i>
      <span data-i18n="menuTransactions">Transactions</span>
    </button>

    <!-- 3. Middle Quick Add (+) Elevated Button -->
    <button onclick="openTransactionModal()" class="-mt-6 w-12 h-12 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-xl shadow-indigo-600/40 border-2 border-[#070a12] active:scale-95 transition">
      <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <!-- 4. Analytics -->
    <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white font-semibold text-[10px]">
      <i class="fa-solid fa-chart-pie text-lg"></i>
      <span data-i18n="menuAnalytics">Analytics</span>
    </button>

    <!-- 5. Profile -->
    <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white font-semibold text-[10px]">
      <i class="fa-solid fa-user text-lg"></i>
      <span data-i18n="menuProfile">Profile</span>
    </button>

  </nav>

  <!-- Quick Add / Edit Modal Popup -->
  <div id="trans-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full relative shadow-2xl">
      <button onclick="closeTransactionModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 id="modal-title" class="text-base font-bold text-white mb-4" data-i18n="addTransaction">Add Transaction</h3>

      <form id="modal-trans-form" class="space-y-3">
        <input type="hidden" id="modal-trans-id" value="">

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1" data-i18n="titleLabel">Title</label>
          <input type="text" id="modal-trans-title" required class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1" data-i18n="amountLabel">Amount</label>
          <input type="number" step="0.01" id="modal-trans-amount" required class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1" data-i18n="typeLabel">Type</label>
            <select id="modal-trans-type" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
              <option value="Expense">Expense</option>
              <option value="Income">Income</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1" data-i18n="categoryLabel">Category</label>
            <select id="modal-trans-category" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
              <option value="Food">Food</option>
              <option value="Salary">Salary</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>

        <button type="submit" id="modal-submit-btn" class="w-full py-2.5 mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg transition" data-i18n="saveTransaction">Save Transaction</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      if(loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.remove(), 500);
      }
    });

    function toggleLanguage() {
      const nextLang = currentLang === 'en' ? 'bn' : 'en';
      setLanguage(nextLang);
      if (typeof loadTransactions === 'function') loadTransactions();
    }
  </script>
</body>
</html>
