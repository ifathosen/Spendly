<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Spendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="glass-card p-8 rounded-2xl max-w-md w-full">
    <h2 class="text-2xl font-bold text-center mb-6" data-i18n="forgotPass">Forgot Password</h2>
    <form id="forgot-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300" data-i18n="email">Email Address</label>
        <input type="email" id="reset-email" required class="w-full px-4 py-2.5 rounded-lg auth-input" placeholder="john@example.com">
      </div>
      <button type="submit" id="reset-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition" data-i18n="sendResetLink">Send Reset Link</button>
    </form>
    <p id="reset-msg" class="text-center text-sm mt-4"></p>
    <p class="text-center text-sm text-slate-400 mt-6"><a href="login.html" class="text-indigo-400 font-medium hover:underline" data-i18n="signIn">Back to Sign In</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
